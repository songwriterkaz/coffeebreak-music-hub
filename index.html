<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coffeebreak Music Hub</title><meta name="description" content="Free Coffeebreak music hub: Stream, Music Store and TV in one app, with real Coffeebreak songs and videos, your own uploads, PayID support and VR.">
<meta name="author" content="Karen (Coffeebreak)">

<style>:root{--bg:#0f0b09;--panel:#1a1411;--panel2:#241b16;--line:#3a2c23;--text:#f4ece4;--muted:#b9a797;--accent:#d9a35b;--accent2:#f0c27b;--good:#7fd18b;--bad:#ef7a6b;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent2)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent2)}
button.primary{background:var(--accent);color:#1b120b;border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent2);color:#1b120b}
button.icon{padding:6px 10px;min-width:36px}
button.on{background:var(--accent);color:#1b120b}
input,select,textarea{background:#120d0b;border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;color:var(--muted);font-size:13px;margin:8px 0 4px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:#0a0706;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px;margin:4px 6px 18px}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.logo svg{flex:none}
.nav button{display:flex;width:100%;text-align:left;border:none;background:none;border-radius:10px;padding:9px 12px;margin:2px 0;color:var(--muted);gap:10px}
.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}
.main{padding:22px 26px 140px;min-width:0}
h1{font-size:26px;margin:0 0 6px}h2{font-size:19px;margin:18px 0 10px}h3{font-size:16px;margin:10px 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.cover{aspect-ratio:1;border-radius:10px;display:flex;align-items:flex-end;padding:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px #0008;margin-bottom:8px;overflow:hidden}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px}
.item:hover{background:var(--panel2)}
.item .t{font-weight:600}.item .s{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.hero{background:linear-gradient(135deg,#5a3418,#1a1411 70%);border-radius:16px;padding:26px;margin-bottom:18px}
.view{display:none}.view.active{display:block}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--accent);color:#1b120b;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px}
.foot .links a{margin-right:16px;font-weight:600}
.notice{background:#1f2a1d;border:1px solid #39553a;color:#cfe8cf;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.tools-list .tool{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.tools-list .tool code{color:var(--accent2);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{padding:4px 10px;font-size:13px}
.out{white-space:pre-wrap;background:#120d0b;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:80px;max-height:340px;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{display:flex;flex-wrap:wrap}.nav button{width:auto}.two{grid-template-columns:1fr}.main{padding:16px 14px 160px}}

:root{--bg:#2a0420;--panel:#4a0a3a;--panel2:#62104e;--line:#8a2a72;--text:#fff4fb;--muted:#ffc2e6;--accent:#ff2fa0;--accent2:#ff9ad5;--candy:#e100ff;--lemon:#ffe066;--mint:#7dffd3;--good:#7dffd3;--bad:#ffb36b;--r:20px;--shadow:0 6px 0 #8c0057,0 14px 26px rgba(0,0,0,.35)}
html,body{background:radial-gradient(1200px 700px at 15% -10%,#7a0b5e 0,transparent 60%),radial-gradient(900px 700px at 110% 20%,#4b0a7a 0,transparent 55%),linear-gradient(160deg,#2a0420,#3d0631 55%,#1f0336);background-attachment:fixed;font-family:"CB Baloo","Baloo 2","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;font-weight:500;font-size:15.5px}
h1,h2,h3,.logo,b,strong{font-weight:800;letter-spacing:.2px}
h1{font-size:34px;line-height:1.1;background:linear-gradient(90deg,#fff,#ff9ad5 40%,#ffe066);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #8c0057)}
h2{font-size:23px;color:#fff;text-shadow:0 3px 0 #8c0057}
a{color:var(--lemon)}
button{background:linear-gradient(180deg,#ff6ec4,#ff2fa0);color:#fff;border:0;border-radius:16px;padding:9px 16px;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.18),0 5px 0 #a3005f,0 9px 16px rgba(0,0,0,.3);transform:translateY(0);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s,filter .12s;text-shadow:0 1px 0 rgba(0,0,0,.2)}
button:hover{color:#fff;border:0;filter:brightness(1.08) saturate(1.1);transform:translateY(-2px) scale(1.03)}
button:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 1px 0 #a3005f,0 2px 6px rgba(0,0,0,.3)}
button.primary,button.on{background:linear-gradient(180deg,#ffe066,#ffb400);color:#5a0040;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.12),0 5px 0 #b37400,0 9px 16px rgba(0,0,0,.3);text-shadow:none}
button.primary:hover{background:linear-gradient(180deg,#fff08f,#ffc21a);color:#5a0040}
button.ghost,button.icon{background:linear-gradient(180deg,#7a1d63,#5c0f4a);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 4px 0 #300426,0 7px 12px rgba(0,0,0,.25)}
button.candy{background:linear-gradient(180deg,#f27bff,#b300e0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 #6c0089,0 9px 16px rgba(0,0,0,.3)}
button.mint{background:linear-gradient(180deg,#a8ffe6,#2fe0aa);color:#04382a;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 #0f8a63,0 9px 16px rgba(0,0,0,.3);text-shadow:none}
input,select,textarea{background:#3a0630;border:2px solid #8a2a72;border-radius:14px;color:#fff;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
input:focus,select:focus,textarea:focus{outline:none;border-color:#ff9ad5;box-shadow:0 0 0 4px rgba(255,47,160,.35)}
.side{background:linear-gradient(180deg,rgba(90,8,70,.92),rgba(40,3,40,.92));border-right:0;box-shadow:6px 0 0 #8c0057,10px 0 30px rgba(0,0,0,.35)}
.logo{font-size:22px}.logo small{color:var(--accent2);font-weight:700}
.logo img.cblogo{width:46px;height:46px;border-radius:14px;object-fit:cover;background:#fdf6ee;box-shadow:0 4px 0 #8c0057;transform:rotate(-6deg);animation:cbWig 4s ease-in-out infinite}
@keyframes cbWig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.05)}}
.nav button{background:none;box-shadow:none;color:var(--muted);font-weight:700;border-radius:14px;text-shadow:none}
.nav button:hover{background:rgba(255,47,160,.18);color:#fff;transform:translateX(4px)}
.nav button.active{background:linear-gradient(90deg,#ff2fa0,#e100ff);color:#fff;box-shadow:0 4px 0 #6c0060}
.nav button.hot{color:var(--lemon)}
.card,.panel{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),var(--panel);border:2px solid rgba(255,154,213,.35);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;transform-style:preserve-3d;will-change:transform}
.card:hover{box-shadow:0 10px 0 #8c0057,0 22px 36px rgba(0,0,0,.4)}
.panel{padding:16px;margin:14px 0}
.cover{border-radius:16px;box-shadow:inset 0 -40px 60px rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.25)}
.item{border-radius:16px}.item:hover{background:rgba(255,47,160,.18)}
.tag{border:2px solid var(--accent2);color:#fff;font-weight:700}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff2fa0 0%,#e100ff 55%,#7a0bd6 100%);border-radius:28px;box-shadow:0 8px 0 #7a0056,0 20px 40px rgba(0,0,0,.4);padding:28px 28px 28px 28px;min-height:170px}
.hero h1{color:#fff;background:none;-webkit-background-clip:initial;background-clip:initial;filter:none;text-shadow:0 4px 0 #8c0057}
.hero .muted,.hero p{color:#fff}
.hero>*{position:relative;z-index:2}
.record3d{position:absolute!important;right:24px;top:50%;width:150px;height:150px;margin-top:-75px;z-index:1!important;perspective:600px;pointer-events:none}
.record3d .disc{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ffe066 0 13%,#ff2fa0 13.5% 22%,#111 22.5% 23.5%,transparent 24%),repeating-radial-gradient(circle at 50% 50%,#1b1b1b 0 2px,#2b2b2b 2px 4px);box-shadow:0 0 0 6px #111,0 14px 0 #3a0030,0 24px 30px rgba(0,0,0,.5);transform:rotateX(52deg);animation:cbSpin 3.2s linear infinite}
.record3d .disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,255,255,.22) 60deg,transparent 80deg 220deg,rgba(255,255,255,.15) 240deg,transparent 260deg)}
@keyframes cbSpin{from{transform:rotateX(52deg) rotateZ(0)}to{transform:rotateX(52deg) rotateZ(360deg)}}
.cbfloat{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cbfloat i{position:absolute;display:block;border-radius:50%;opacity:.22;filter:blur(.3px);animation:cbBob 9s ease-in-out infinite}
.cbfloat i.sq{border-radius:12px}.cbfloat i.ring{background:none!important;border:8px solid #ff9ad5}
@keyframes cbBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-40px) rotate(160deg)}}
.app{position:relative;z-index:1}
.view.active{animation:cbPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes cbPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.toast{background:linear-gradient(180deg,#ffe066,#ffb400);color:#5a0040;font-weight:800;box-shadow:0 5px 0 #b37400;border-radius:18px}
.foot{border-top:3px dashed rgba(255,154,213,.5)}
.foot .links a{display:inline-block;background:#fff;color:#c2007a;padding:4px 12px;border-radius:12px;box-shadow:0 3px 0 #8c0057;text-decoration:none}
.notice{background:rgba(125,255,211,.12);border:2px solid #7dffd3;color:#e9fff8;border-radius:16px}
.out{background:#3a0630;border:2px solid #8a2a72;border-radius:14px}
#player,#mini{background:linear-gradient(180deg,rgba(98,16,78,.96),rgba(42,4,32,.98))!important;border-top:3px solid #ff2fa0!important;box-shadow:0 -6px 24px rgba(0,0,0,.4)}
.pro-badge{display:inline-block;background:linear-gradient(180deg,#ffe066,#ffb400);color:#5a0040;font-weight:800;border-radius:10px;padding:1px 9px;font-size:13px;box-shadow:0 3px 0 #b37400;vertical-align:middle}
.paybox{background:#fff;color:#4a0a3a;border-radius:18px;padding:14px;box-shadow:0 5px 0 #8c0057;font-weight:600}
.paybox b{color:#c2007a}
.cbmodal{position:fixed;inset:0;background:rgba(20,0,16,.72);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.cbmodal .box{background:linear-gradient(160deg,#6a1154,#3d0631);border:3px solid #ff9ad5;border-radius:26px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 0 #8c0057,0 30px 60px rgba(0,0,0,.5);animation:cbPop .4s cubic-bezier(.3,1.6,.5,1)}
.cbmodal h3{font-size:24px;margin-top:0}
.feat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,#ffe066,#ff9ad5)!important;color:#4a0a3a;border:0!important}
.feat .muted{color:#7a1d63}
.vrwrap{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 8px 0 #8c0057,0 20px 40px rgba(0,0,0,.45);border:3px solid #ff9ad5;background:#2a0420}
.vrwrap canvas{display:block;width:100%;height:460px;touch-action:none;cursor:grab}
.vrhint{position:absolute;left:14px;top:12px;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:12px;font-weight:700;pointer-events:none}
.vrbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
.vrbar select{width:auto;max-width:320px}
.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;box-shadow:0 6px 0 #8c0057;border:4px solid #fff;background:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#player,#mini{background:linear-gradient(180deg,rgba(98,16,78,.97),rgba(42,4,32,.99))!important;border-top:3px solid #ff2fa0!important}
.hero{padding-right:200px}
@media(max-width:820px){.hero{padding-right:28px}.record3d{display:none}.vrwrap canvas{height:340px}}
.thumb{border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.vcard{border-radius:18px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.vcard:hover{background:rgba(255,47,160,.18)}
.myrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px}.myrow:hover{background:rgba(255,47,160,.15)}.myrow .grow{flex:1;min-width:0}

html,body{height:100%}
.hubtop{display:flex;align-items:center;gap:14px;padding:10px 16px;position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#3a0530,#2a0420);border-bottom:3px solid #ff2fa0;flex-wrap:wrap}
.hubtop .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.hubtop .brand small{display:block;font-size:12px;color:var(--accent2);font-weight:700}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tabs button{font-size:16px;padding:10px 18px}
.hubframe{width:100%;height:calc(100vh - 74px);border:0;display:none;background:var(--bg)}
.hubframe.on{display:block}
.hubwrap{position:relative}
@media (max-width:700px){.hubframe{height:calc(100vh - 120px)}}

<script>/* Coffeebreak shared library. Copyright Karen (Coffeebreak). All rights reserved. */
const CB = {};
CB.$ = (s, r) => (r || document).querySelector(s);
CB.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
CB.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
CB.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
CB.fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- IndexedDB blob store ---------- */
CB.idb = {
  db: null,
  open() { if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open(CB.prefix + '-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async put(k, v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files'); const q = tx.objectStore('files').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async del(k) { const db = await this.open(); return new Promise(res => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(k); tx.oncomplete = () => res(); }); }
};

/* ---------- Demo audio (generated tones, no outside files) ---------- */
CB.makeDemoWav = (seed, seconds) => {
  const sr = 22050, n = Math.floor(sr * (seconds || 24)); const buf = new ArrayBuffer(44 + n * 2); const v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  const progs = [[0, 5, 7, 3], [0, 3, 5, 4], [0, 7, 5, 4], [0, 4, 5, 3]]; const prog = progs[seed % progs.length]; const scale = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19];
  const root = 196 * Math.pow(2, (seed % 5) / 12); const beat = 60 / (84 + seed * 6);
  for (let i = 0; i < n; i++) {
    const t = i / sr; const bar = Math.floor(t / (beat * 4)) % 4; const deg = prog[bar]; const f = root * Math.pow(2, scale[deg] / 12);
    let s = 0; [0, 2, 4].forEach(k => { s += Math.sin(2 * Math.PI * f * Math.pow(2, scale[k] / 12) * t) * 0.12; });
    const st = t % beat; const mel = root * 2 * Math.pow(2, scale[(Math.floor(t / beat) * (seed + 3)) % 8] / 12); s += Math.sin(2 * Math.PI * mel * t) * 0.16 * Math.exp(-st * 3);
    s += Math.sin(2 * Math.PI * 55 * Math.pow(2, scale[deg] / 12) * t) * 0.2 * Math.exp(-st * 6);
    const env = Math.min(1, t * 2, (seconds - t) * 2); v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s * env)) * 30000, true);
  }
  return new Blob([buf], {type: 'audio/wav'});
};

/* ---------- 10-band equalizer (WebAudio) ---------- */
CB.EQ_BANDS = [32, 64, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];
CB.eq = {
  ctx: null, filters: [], pre: null, gains: CB.EQ_BANDS.map(() => 0), preamp: 0, enabled: true, sources: new WeakMap(),
  ensure() { if (this.ctx) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); this.pre = this.ctx.createGain(); let last = this.pre;
    this.filters = CB.EQ_BANDS.map((f, i) => { const b = this.ctx.createBiquadFilter(); b.type = i === 0 ? 'lowshelf' : i === 9 ? 'highshelf' : 'peaking'; b.frequency.value = f; b.Q.value = 1.1; last.connect(b); last = b; return b; });
    last.connect(this.ctx.destination); this.update(); },
  attach(el) { try { this.ensure(); if (!this.ctx || this.sources.has(el)) return; const src = this.ctx.createMediaElementSource(el); src.connect(this.pre); this.sources.set(el, src); } catch (e) { /* already attached */ } },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  set(gains, preamp) { this.gains = gains.slice(0, 10).map(Number); if (preamp != null) this.preamp = Number(preamp); this.update(); CB.save('eq', {gains: this.gains, preamp: this.preamp, enabled: this.enabled, name: this.name || 'Custom'}); if (this.onchange) this.onchange(); },
  update() { if (!this.ctx) return; this.filters.forEach((b, i) => b.gain.value = this.enabled ? this.gains[i] : 0); this.pre.gain.value = Math.pow(10, (this.enabled ? this.preamp : 0) / 20); },
  restore() { const s = CB.load('eq', null); if (s) { this.gains = s.gains; this.preamp = s.preamp || 0; this.enabled = s.enabled !== false; this.name = s.name; } }
};

  <div class="card"><h3>Result</h3><div id="tlOut" class="out muted">Pick a tool and press its button. The result shows here.</div><canvas id="tlCanvas" width="1280" height="720" style="width:100%;display:none;border-radius:10px;margin-top:8px"></canvas>
  <div class="row" style="margin-top:8px"><button id="tlCopy">Copy result</button><button id="tlFavBtn">Save to My Toolkit</button><button id="tlPng" style="display:none">Download thumbnail PNG</button></div></div></div>
  <h2>Find a tool</h2><input id="tlSearch" placeholder="Search 12,000 tools, for example: country caption tiktok">
  <div class="chips" id="tlChips"></div><p class="small muted" id="tlCount"></p><div class="tools-list card" id="tlList" style="padding:0"></div>
  <div class="row" style="margin-top:10px"><button id="tlMore">Show more</button></div><h2>My Toolkit</h2><div id="tlFav" class="list"></div>`;
  const $ = s => CB.$(s, el); let last = null;
  $('#tlTitle').value = st.title || (opts.defaults ? opts.defaults().title : ''); $('#tlArtist').value = st.artist || 'Coffeebreak'; $('#tlLink').value = st.link || 'https://coffeebreaks.itch.io'; $('#tlDate').value = st.date || ''; $('#tlSearch').value = st.q || '';
  const persist = () => { st.title = $('#tlTitle').value; st.artist = $('#tlArtist').value; st.link = $('#tlLink').value; st.date = $('#tlDate').value; st.q = $('#tlSearch').value; CB.save('tools', st); };
  ['#tlTitle', '#tlArtist', '#tlLink', '#tlDate'].forEach(s => $(s).addEventListener('change', persist));
  $('#tlChips').innerHTML = `<button data-c="all" class="on">All</button>` + T.cats.map(c => `<button data-c="${c.id}">${c.name}s</button>`).join('');
  $('#tlChips').onclick = e => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; CB.$$('button', $('#tlChips')).forEach(x => x.classList.toggle('on', x === b)); filter(); };
  function filter() { const words = $('#tlSearch').value.toLowerCase().split(/\s+/).filter(Boolean); filtered = T.list.filter(t => (cat === 'all' || t.cat === cat) && words.every(w => t.lc.includes(w) || t.id.toLowerCase() === w)); page = 60; render(); persist(); }
  function render() { $('#tlCount').textContent = `${filtered.length.toLocaleString('en-AU')} of ${T.TOTAL.toLocaleString('en-AU')} tools`;
    $('#tlList').innerHTML = filtered.slice(0, page).map(t => `<div class="tool"><code>${t.id}</code><div>${CB.esc(t.name)}</div><button class="${t.act === 'Apply' ? 'primary' : ''}" data-i="${t.i}">${t.act}</button></div>`).join('') || '<p class="muted" style="padding:12px">No tools match. Try fewer words.</p>';
    $('#tlMore').style.display = filtered.length > page ? '' : 'none'; }
  function songs() { const s = opts.songs ? opts.songs() : []; $('#tlSongs').innerHTML = s.map(x => `<option value="${CB.esc(x)}">`).join(''); }
  function runTool(i) { persist(); const t = T.list[i]; const r = T.run(t, st); last = r; $('#tlOut').classList.remove('muted'); $('#tlOut').textContent = r.text; $('#tlCanvas').style.display = 'none'; $('#tlPng').style.display = 'none';
    if (t.act === 'Copy') CB.copy(r.text);
    if (r.eq) { if (opts.onApplyEQ) { opts.onApplyEQ(r.eq, t.name); CB.toast('EQ preset applied: ' + t.name); } }
    if (r.thumb) { T.drawThumb($('#tlCanvas'), r.thumb); $('#tlCanvas').style.display = 'block'; $('#tlPng').style.display = ''; if (opts.onApplyThumb) opts.onApplyThumb(r.thumb, $('#tlCanvas')); else CB.toast('Thumbnail layout applied'); }
    if (t.act === 'Generate') CB.toast('Generated'); el.dataset.lastTool = t.id; }
  $('#tlList').onclick = e => { const b = e.target.closest('button[data-i]'); if (b) runTool(+b.dataset.i); };
  $('#tlFav').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.run) runTool(+b.dataset.run); if (b.dataset.rm) { st.fav = st.fav.filter(x => x !== +b.dataset.rm); CB.save('tools', st); favs(); } };
  let deb; $('#tlSearch').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(filter, 120); });
  $('#tlMore').onclick = () => { page += 60; render(); };
  $('#tlCopy').onclick = () => { if (last) CB.copy(last.text); else CB.toast('Run a tool first'); };
  $('#tlPng').onclick = () => $('#tlCanvas').toBlob(b => CB.download('coffeebreak-thumbnail.png', b));
  $('#tlFavBtn').onclick = () => { if (!last) return CB.toast('Run a tool first'); if (!st.fav.includes(last.tool.i)) st.fav.unshift(last.tool.i); CB.save('tools', st); favs(); CB.toast('Saved to My Toolkit'); };
  function favs() { $('#tlFav').innerHTML = st.fav.length ? st.fav.map(i => { const t = T.list[i]; return `<div class="item"><code class="small">${t.id}</code><div class="t">${CB.esc(t.name)}</div><div class="row"><button data-run="${i}">${t.act}</button><button class="icon" data-rm="${i}" title="Remove">x</button></div></div>`; }).join('') : '<p class="muted small">Tools you save show here.</p>'; }
  filter(); favs(); songs();
  return {refreshSongs: songs, run: runTool};
};

/* Shared navigation helper */
CB.nav = function (views, onShow) {
  const go = v => { CB.$$('.view').forEach(x => x.classList.toggle('active', x.id === 'v-' + v)); CB.$$('.nav button').forEach(b => b.classList.toggle('active', b.dataset.v === v)); CB.save('view', v); if (onShow) onShow(v); window.scrollTo(0, 0); };
  CB.$$('.nav button').forEach(b => b.onclick = () => go(b.dataset.v));
  return go;
};

CB.prefix = 'cbhub';
CB.$('#footMount').outerHTML = CB.footer('Coffeebreak Music Hub', "Spotify, Apple, Apple Music, iTunes and YouTube");
const TABS = ['stream', 'music-store', 'tv'], frames = {};
function tab(t) { if (!TABS.includes(t)) t = 'stream';
  if (!frames[t]) { const f = document.createElement('iframe'); f.className = 'hubframe'; f.id = 'f-' + t; f.title = t; f.src = t + '/index.html'; f.allow = 'autoplay; fullscreen; xr-spatial-tracking'; f.setAttribute('allowfullscreen', ''); CB.$('#frames').appendChild(f); frames[t] = f; }
  TABS.forEach(k => { if (frames[k]) frames[k].classList.toggle('on', k === t); });
  CB.$$('.tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); CB.save('tab', t); if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t); }
CB.$$('.tabs [data-tab]').forEach(b => b.onclick = () => tab(b.dataset.tab));
tab((location.hash || '').slice(1) || CB.load('tab', 'stream'));
</script></body></html>
